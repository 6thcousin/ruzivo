<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — ZivoPay Onboarding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f1923 0%, #1a2942 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #0f1923, #1e3a5f);
      padding: 2rem;
      text-align: center;
    }
    .login-header .brand { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .login-header .sub   { font-size: .8rem; color: #64748b; letter-spacing: .08em; text-transform: uppercase; margin-top: .25rem; }
    .login-body { padding: 2rem; }
    .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13,110,253,.15); }
    .btn-login {
      background: linear-gradient(135deg, #0d6efd, #0a58ca);
      border: none; color: #fff; font-weight: 600;
      padding: .65rem; border-radius: 8px;
      transition: opacity .15s;
    }
    .btn-login:hover { opacity: .9; color: #fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="brand"><i class="bi bi-broadcast-pin me-2"></i>ZivoPay</div>
      <div class="sub">Onboarding Manager</div>
    </div>
    <div class="login-body">
      {% if error %}
      <div class="alert alert-danger alert-sm py-2 px-3 mb-3 rounded-3" style="font-size:.875rem">
        <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
      </div>
      {% endif %}
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="admin"
                   autofocus autocomplete="username" required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control"
                   placeholder="••••••••" autocomplete="current-password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-login w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">onboarding.zivopay.online</small>
      </div>
    </div>
  </div>
</body>
</html>
