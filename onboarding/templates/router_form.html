{% extends "layout.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-router me-2 text-primary"></i>{{ title }}
        {% if client %}<span class="text-muted small ms-2">for {{ client.name }}</span>{% endif %}
      </div>
      <div class="card-body">
        <form method="post">
          <div class="row g-3">

            <div class="col-sm-8">
              <label class="form-label fw-semibold">Router Name <span class="text-danger">*</span></label>
              <input class="form-control" name="name" required
                     value="{{ router.name if router else '' }}"
                     placeholder="e.g. siganda_secondary">
            </div>
            <div class="col-sm-4">
              <label class="form-label fw-semibold">Connection Type</label>
              <select class="form-select" name="connection_type" id="conn-type-select"
                      onchange="toggleConnFields()">
                <option value="wireguard" {{ 'selected' if (router and router.connection_type=='wireguard') or not router }}>WireGuard (VPN)</option>
                <option value="local" {{ 'selected' if router and router.connection_type=='local' }}>Local / Direct LAN</option>
              </select>
            </div>

            <div class="col-sm-6">
              <label class="form-label fw-semibold">Host / IP <span class="text-danger">*</span></label>
              <input class="form-control font-monospace" name="host" required
                     value="{{ router.host if router else '' }}"
                     placeholder="10.0.0.7 or 192.168.88.1">
            </div>
            <div class="col-sm-3">
              <label class="form-label fw-semibold">API Port</label>
              <input class="form-control" name="port" type="number"
                     value="{{ router.port if router else 8728 }}">
            </div>
            <div class="col-sm-3">
              <label class="form-label fw-semibold">Username</label>
              <input class="form-control" name="username"
                     value="{{ router.username if router else 'admin' }}">
            </div>

            <div class="col-sm-6">
              <label class="form-label fw-semibold">Password</label>
              <input class="form-control" name="password" type="password"
                     value="{{ router.password if router else '' }}"
                     autocomplete="new-password">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">WiFi SSID</label>
              <input class="form-control" name="ssid"
                     value="{{ router.ssid if router else '' }}"
                     placeholder="Optional — hotspot network name">
            </div>

            <!-- WireGuard fields -->
            <div id="wg-fields">
              <div class="row g-3">
                <div class="col-sm-6">
                  <label class="form-label fw-semibold">WireGuard Tunnel IP</label>
                  <input class="form-control font-monospace" name="wg_ip"
                         value="{{ router.wg_ip if router else '' }}"
                         placeholder="10.0.0.x">
                </div>
                <div class="col-sm-6">
                  <label class="form-label fw-semibold">WireGuard Public Key</label>
                  <input class="form-control font-monospace small" name="wg_public_key"
                         value="{{ router.wg_public_key if router else '' }}"
                         placeholder="Base64 public key (optional)">
                </div>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Notes</label>
              <textarea class="form-control" name="notes" rows="2">{{ router.notes if router else '' }}</textarea>
            </div>

          </div>

          <!-- Test connection -->
          <div class="mt-3 d-flex align-items-center gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="testConn()">
              <i class="bi bi-plug me-1"></i>Test Connection
            </button>
            <span id="test-result" class="small"></span>
          </div>

          <hr class="my-3">
          <div class="d-flex gap-2 justify-content-end">
            <a href="{{ url_for('client_detail', client_id=client.id if client else 0) }}"
               class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>{{ 'Save Changes' if router else 'Add Router' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleConnFields() {
  const t = document.getElementById('conn-type-select').value;
  document.getElementById('wg-fields').style.display = t === 'wireguard' ? '' : 'none';
}
toggleConnFields();

function testConn() {
  const host = document.querySelector('[name=host]').value.trim();
  const port = document.querySelector('[name=port]').value.trim();
  const user = document.querySelector('[name=username]').value.trim();
  const pass = document.querySelector('[name=password]').value.trim();
  if (!host) { alert('Enter a host first.'); return; }

  const el = document.getElementById('test-result');
  el.innerHTML = '<span class="text-muted"><span class="spinner-border spinner-border-sm me-1"></span>Testing…</span>';

  const fd = new FormData();
  fd.append('host', host); fd.append('port', port);
  fd.append('username', user); fd.append('password', pass);

  fetch('/api/test-adhoc', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(d => {
      el.innerHTML = d.success
        ? `<span class="text-success"><i class="bi bi-check-circle me-1"></i>OK — <b>${d.identity}</b> (${d.board}, v${d.version})</span>`
        : `<span class="text-danger"><i class="bi bi-x-circle me-1"></i>${d.error}</span>`;
    });
}
</script>
{% endblock %}
