# /etc/nginx/sites-available/zivopay-onboarding
# Symlink: ln -s /etc/nginx/sites-available/zivopay-onboarding /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name onboarding.zivopay.online;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name onboarding.zivopay.online;

    # SSL (managed by Certbot — do not edit these manually)
    ssl_certificate     /etc/letsencrypt/live/onboarding.zivopay.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onboarding.zivopay.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;

    # Proxy to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # Static files (if any)
    location /static/ {
        alias /opt/zivopay-onboarding/static/;
        expires 7d;
        access_log off;
    }

    access_log /var/log/nginx/zivopay-onboarding.access.log;
    error_log  /var/log/nginx/zivopay-onboarding.error.log;
}
