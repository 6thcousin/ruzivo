<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ZivoPay AutoConfig{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --green: #1a6b3c; --gold: #d4a017; }
    body  { background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    .navbar { background: #111827 !important; border-bottom: 1px solid #1f2937; }
    .navbar-brand { color: var(--gold) !important; font-weight: 800; letter-spacing: .04em; }
    .card  { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px; }
    .card-header { background: #111827; border-bottom: 1px solid #2d3748; font-weight: 600; }
    .form-control, .form-select {
      background: #111827; border: 1px solid #374151; color: #e2e8f0; border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background: #111827; color: #e2e8f0;
      border-color: var(--green); box-shadow: 0 0 0 .2rem rgba(26,107,60,.25);
    }
    .form-label { font-weight: 600; font-size: .85rem; color: #9ca3af; }
    .btn-primary { background: var(--green); border-color: var(--green); font-weight: 700; }
    .btn-primary:hover { background: #155230; border-color: #155230; }
    .badge-wg { background: #1e3a5f; color: #60a5fa; border-radius: 6px; font-family: monospace; }
    .script-box {
      background: #0d1117; border: 1px solid #30363d; border-radius: 10px;
      padding: 1rem; font-family: monospace; font-size: .78rem; color: #c9d1d9;
      white-space: pre; overflow-x: auto; max-height: 420px; overflow-y: auto;
    }
    .step-badge {
      width: 28px; height: 28px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; font-weight: 800; font-size: .8rem;
    }
    .step-active  { background: var(--green); color: #fff; }
    .step-done    { background: #065f46; color: #6ee7b7; }
    .step-pending { background: #374151; color: #9ca3af; }
    .stat-pill { background: #111827; border: 1px solid #374151; border-radius: 8px; padding: .4rem .8rem; }
    .text-gold { color: var(--gold); }
    table { color: #e2e8f0; }
    .table-dark-custom tbody tr:hover { background: rgba(255,255,255,.04); }
    a { color: #60a5fa; }
    .alert-success { background: #064e3b; border-color: #065f46; color: #6ee7b7; }
    .alert-warning { background: #451a03; border-color: #78350f; color: #fcd34d; }
    .alert-danger  { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
    .alert-secondary { background: #1f2937; border-color: #374151; color: #9ca3af; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark px-3 py-2">
  <a class="navbar-brand" href="{{ url_for('index') }}">
    <i class="bi bi-router-fill me-2"></i>ZivoPay AutoConfig
  </a>
  <div class="d-flex gap-2 align-items-center">
    <a href="{{ url_for('new_client') }}" class="btn btn-sm btn-primary">
      <i class="bi bi-plus-lg me-1"></i>New Client
    </a>
    <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-box-arrow-right"></i>
    </a>
  </div>
</nav>

<div class="container py-4" style="max-width:720px">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
    <div class="alert alert-{{ cat }} alert-dismissible rounded-3 mb-3 d-flex align-items-center gap-2">
      <i class="bi bi-{{ 'check-circle-fill' if cat == 'success' else 'exclamation-triangle-fill' if cat == 'warning' else 'x-circle-fill' if cat == 'danger' else 'info-circle-fill' }}"></i>
      <span>{{ msg }}</span>
      <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
