{% extends "base.html" %}
{% block title %}Login — ZivoPay AutoConfig{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:80vh">
  <div class="card p-4" style="width:100%;max-width:380px">
    <div class="text-center mb-4">
      <div style="font-size:2.5rem;color:var(--gold)"><i class="bi bi-router-fill"></i></div>
      <h5 class="fw-bold mt-2 mb-0">ZivoPay AutoConfig</h5>
      <div class="text-muted small">Technician Portal</div>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small"><i class="bi bi-x-circle me-1"></i>{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" class="form-control" placeholder="admin" autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100 fw-bold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
