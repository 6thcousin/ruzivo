<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — ZivoPay AutoConfig</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --gold: #d4a017; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body {
      background: #060810;
      --text: #fff; --sub: rgba(255,255,255,.35);
      --label: rgba(255,255,255,.4);
      --ibg: rgba(255,255,255,.06);
      --iborder: rgba(255,255,255,.1);
      --ifocus: rgba(255,255,255,.10);
      --toggle-bg: rgba(255,255,255,.08);
      --toggle-border: rgba(255,255,255,.15);
    }
    body.light {
      background: #eef2ff;
      --text: #0f1117; --sub: rgba(0,0,0,.4);
      --label: rgba(0,0,0,.45);
      --ibg: rgba(0,0,0,.05);
      --iborder: rgba(0,0,0,.12);
      --ifocus: rgba(0,0,0,.08);
      --toggle-bg: rgba(0,0,0,.06);
      --toggle-border: rgba(0,0,0,.12);
    }

    .theme-toggle {
      position: fixed; top: 1rem; right: 1rem; z-index: 10;
      background: var(--toggle-bg); border: 1px solid var(--toggle-border);
      border-radius: 50%; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; color: var(--label);
      backdrop-filter: blur(8px); transition: all .2s;
    }
    .theme-toggle:hover { transform: scale(1.1); }

    .bg-logo {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 55%; opacity: .13; z-index: 0;
      transition: opacity .3s;
    }
    body.light .bg-logo { opacity: .08; filter: saturate(0); }

    .bg-overlay { position: fixed; inset: 0; background: transparent; z-index: 1; }

    .login-float {
      position: fixed; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
    }

    .login-inner {
      width: 100%; max-width: 340px; padding: 1rem;
      text-align: center; color: var(--text);
    }

    .login-logo { height: 68px; object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(212,160,23,.55)); margin-bottom: 1rem; }

    .login-title { font-size: 1.2rem; font-weight: 800; letter-spacing: .05em; margin-bottom: .15rem; }
    .login-sub   { font-size: .7rem; color: var(--sub); text-transform: uppercase;
                   letter-spacing: .1em; margin-bottom: 2rem; }

    .field-wrap  { margin-bottom: 1rem; text-align: left; }
    .field-label { display: block; font-size: .7rem; font-weight: 700; color: var(--label);
                   text-transform: uppercase; letter-spacing: .08em; margin-bottom: .3rem; }
    .field-input {
      width: 100%; padding: .65rem 1rem; box-sizing: border-box;
      background: var(--ibg); border: 1px solid var(--iborder);
      border-radius: 12px; color: var(--text); font-size: .93rem;
      outline: none; transition: all .2s;
    }
    .field-input::placeholder { color: var(--label); }
    .field-input:focus {
      background: var(--ifocus);
      border-color: rgba(212,160,23,.55);
      box-shadow: 0 0 0 3px rgba(212,160,23,.1);
    }

    .glass-btn {
      width: 100%; padding: .8rem; margin-top: .5rem; border-radius: 12px;
      font-weight: 700; font-size: .95rem; letter-spacing: .05em;
      background: rgba(212,160,23,.15); border: 1px solid rgba(212,160,23,.45);
      color: #c8860a; backdrop-filter: blur(12px); cursor: pointer; transition: all .2s;
    }
    body.light .glass-btn { color: #92600a; }
    .glass-btn:hover { background: rgba(212,160,23,.27); box-shadow: 0 0 28px rgba(212,160,23,.25); }

    .links-row { margin-top: 1.2rem; display: flex; justify-content: space-between; font-size: .78rem; }
    .links-row a { color: rgba(212,160,23,.7); text-decoration: none; transition: color .2s; }
    .links-row a:hover { color: var(--gold); }

    .err-msg {
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px; padding: .5rem .8rem;
      font-size: .82rem; color: #dc2626; margin-bottom: 1rem; text-align: left;
    }
  </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">
  <i id="theme-icon" class="bi bi-sun-fill"></i>
</button>

<img class="bg-logo" src="/static/logo.png" alt=""
     onerror="this.style.display='none'">
<div class="bg-overlay"></div>

<div class="login-float">
  <div class="login-inner">
    <img class="login-logo" src="/static/logo.png" alt="ZivoPay"
         onerror="this.style.display='none'">
    <div class="login-title">ZivoPay AutoConfig</div>
    <div class="login-sub">Technician Portal</div>

    {% if error %}
    <div class="err-msg"><i class="bi bi-x-circle me-1"></i>{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field-wrap">
        <label class="field-label">Username</label>
        <input name="username" class="field-input" placeholder="admin" autocomplete="username">
      </div>
      <div class="field-wrap">
        <label class="field-label">Password</label>
        <input name="password" type="password" class="field-input" autocomplete="current-password">
      </div>
      <button class="glass-btn">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="links-row">
      <a href="/forgot-password"><i class="bi bi-key me-1"></i>Forgot Password?</a>
      <a href="/register"><i class="bi bi-person-plus me-1"></i>Create Account</a>
    </div>
  </div>
</div>

<script>
  const icon = document.getElementById('theme-icon');
  const saved = localStorage.getItem('zp-theme');
  if (saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches)) {
    document.body.classList.add('light');
    icon.className = 'bi bi-moon-fill';
  }
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    icon.className = isLight ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
    localStorage.setItem('zp-theme', isLight ? 'light' : 'dark');
  }
</script>
</body>
</html>
